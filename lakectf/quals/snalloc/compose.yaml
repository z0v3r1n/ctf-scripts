services:
  snalloc:
    build: .
    ports:
      - 6019:5000
      #      - 127.0.0.1:6019:5000
    cap_drop:
      - all
    cap_add:
      - chown
      - setuid
      - setgid
      - sys_admin
      - mknod
    security_opt:
      - apparmor=unconfined
      - seccomp=unconfined
      - systempaths=unconfined
